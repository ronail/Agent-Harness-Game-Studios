# Project-local Codex defaults for Claude Code Game Studios.
#
# Keep command approvals interactive and limit writes/network access to the
# trusted workspace. The project must be trusted before Codex loads this file.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# The Claude-compatible skill and agent frontmatter uses three model tiers:
# haiku, sonnet, and opus. Codex uses a model plus a reasoning effort instead.
# The standard tier is the project default. Use the commands documented by
# `/start codex` when a different tier is needed.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[features]
hooks = true
